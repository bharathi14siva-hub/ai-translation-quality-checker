
[project]
name = "ai-translation-quality-checker"
version = "0.1.0"
description = "AI-powered translation tool with quality checking"
authors = [
    {name = "bharathi", email = "bharathi14siva@gmail.com"}
]
requires-python = ">=3.10,<3.11"
dependencies = ["google-genai (<2.24)", "pydantic (>=2.14.3,<3.0.0)", "python-dotenv (>=1.2.4,<2.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "ruff (>=0.17.4,<0.18.0)"
]
